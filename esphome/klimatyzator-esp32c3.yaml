# Klimatyzator AUX (protokół GrKoR/esphome_aux_ac_component) na ESP32-C3 - szablon ogólny.
# Brak danych Wi-Fi, haseł i stałego IP: po wgraniu moduł wystawia otwarty AP "Klimatyzator-ESPC3",
# po połączeniu captive portal (192.168.4.1) pozwala wybrać sieć. Dane Wi-Fi zostają we flash.
# Nazwa w sieci dostaje końcówkę z MAC (klimatyzator-c3-xxxxxx), więc ten sam .bin pasuje do wielu sztuk.
#
# Opcja: regulacja według temperatury w pokoju. Regulator PI przesuwa nastawę klimatyzatora tak, żeby
# w pokoju była "Temperatura zadana pokoju - grzanie" / "- chłodzenie". Wybór w HA:
# - "Źródło temperatury pokoju": czujnik klimatyzatora (regulacja wyłączona), termometr z Home Assistant
#   albo DS18B20 na kablu w GPIO4 / GPIO5 (jeden czujnik na pin, wykrywany przy starcie modułu).
#   Termometr z HA: moduł jest Bluetooth proxy, więc HA sam wykrywa termometry BLE w jego zasięgu
#   (np. pvvx/BTHome), a blueprint ../blueprints/klimatyzator-termometr.yaml wpisuje odczyt wybranego
#   czujnika do "Temperatura z termometru".
# - "Regulacja w trybach": grzanie i chłodzenie, tylko grzanie albo tylko chłodzenie.

substitutions:
  name: klimatyzator-c3
  friendly_name: Klimatyzator
  ap_ssid: Klimatyzator-ESPC3
  uart_tx: GPIO21
  uart_rx: GPIO20
  # wyprowadzenia użytkownika na PCB - magistrale 1-Wire pod DS18B20
  ds_pin_a: GPIO4
  ds_pin_b: GPIO5
  # regulator PI nastawy: maks. odchyłka nastawy od celu [°C]; Kp i Ki to encje w HA (autostrojenie)
  reg_max: "4.0"
  # autostrojenie: wychylenie nastawy w metodzie przekaźnikowej [°C], histereza przełączania [°C]
  at_amp: "2.0"
  at_hyst: "0.2"
  # po tylu minutach bez odczytu z termometru regulacja wraca do czujnika klimatyzatora
  room_timeout_min: "15"

external_components:
  - source: github://GrKoR/esphome_aux_ac_component
    components: [ aux_ac ]
    refresh: 0s

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: adek1990.klimatyzator-aux-c3
    version: "1.2.0"

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

safe_mode:

preferences:
  flash_write_interval: 10min

# log po USB (USB_SERIAL_JTAG) - UART0 zostaje wolny dla klimatyzatora
logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

api:

ota:
  - platform: esphome

wifi:
  reboot_timeout: 0s
  output_power: 20 dB
  ap:
    ssid: ${ap_ssid}
  # ESP32-C3 ma jedno radio na Wi-Fi i BLE - Bluetooth dopiero po połączeniu z siecią,
  # żeby nie zakłócał punktu dostępu konfiguracji
  on_connect:
    - ble.enable:
  on_disconnect:
    - ble.disable:

captive_portal:

# konfiguracja Wi-Fi także przez kabel USB (np. web.esphome.io)
improv_serial:

# Bluetooth proxy - HA wykrywa termometry BLE w zasięgu modułu (pasywnie, bez połączeń)
esp32_ble:
  enable_on_boot: false

esp32_ble_tracker:
  scan_parameters:
    active: false

bluetooth_proxy:
  active: false

globals:
  - id: reg_i
    type: float
    initial_value: "0"
  # ostatnia nastawa wysłana przez regulator; NAN = regulator nic jeszcze nie wysłał
  - id: reg_sent
    type: float
    initial_value: "NAN"
  # tryb, w którym liczono całkę - zmiana grzanie/chłodzenie ją zeruje
  - id: reg_mode
    type: int
    initial_value: "-1"
  - id: room_ts
    type: uint32_t
    initial_value: "0"
  - id: room_seen
    type: bool
    initial_value: "false"
  # autostrojenie (metoda przekaźnikowa): stan przekaźnika, chwile przełączeń, ekstrema półokresów
  - id: at_on
    type: bool
    initial_value: "false"
  - id: at_high
    type: bool
    initial_value: "true"
  - id: at_base
    type: float
    initial_value: "NAN"
  - id: at_start
    type: uint32_t
    initial_value: "0"
  - id: at_cur
    type: float
    initial_value: "NAN"
  - id: at_sw
    type: std::vector<uint32_t>
  - id: at_ext
    type: std::vector<float>

one_wire:
  - platform: gpio
    id: ow_a
    pin: ${ds_pin_a}
  - platform: gpio
    id: ow_b
    pin: ${ds_pin_b}

select:
  - platform: template
    name: "Źródło temperatury pokoju"
    id: temp_source
    icon: mdi:thermometer-auto
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - "Czujnik klimatyzatora"
      - "Termometr z Home Assistant"
      - "DS18B20 na GPIO4"
      - "DS18B20 na GPIO5"
    initial_option: "Czujnik klimatyzatora"
    on_value:
      - lambda: |-
          id(reg_i) = 0;
          id(reg_sent) = NAN;
  - platform: template
    name: "Regulacja w trybach"
    id: reg_modes
    icon: mdi:sun-snowflake-variant
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - "Grzanie i chłodzenie"
      - "Tylko grzanie"
      - "Tylko chłodzenie"
    initial_option: "Grzanie i chłodzenie"

number:
  - platform: template
    name: "Temperatura zadana pokoju - grzanie"
    id: room_target_heat
    icon: mdi:home-thermometer
    min_value: 16
    max_value: 32
    step: 0.5
    unit_of_measurement: "°C"
    optimistic: true
    restore_value: true
    initial_value: 21
  - platform: template
    name: "Temperatura zadana pokoju - chłodzenie"
    id: room_target_cool
    icon: mdi:home-thermometer-outline
    min_value: 16
    max_value: 32
    step: 0.5
    unit_of_measurement: "°C"
    optimistic: true
    restore_value: true
    initial_value: 25
  # nastawy regulatora PI - wpisuje je autostrojenie, można poprawić ręcznie
  - platform: template
    name: "Regulator Kp"
    id: reg_kp
    icon: mdi:tune-variant
    entity_category: config
    min_value: 0.1
    max_value: 5
    step: 0.05
    mode: box
    unit_of_measurement: "°C/°C"
    optimistic: true
    restore_value: true
    initial_value: 1.0
  - platform: template
    name: "Regulator Ki"
    id: reg_ki
    icon: mdi:tune-variant
    entity_category: config
    min_value: 0
    max_value: 10
    step: 0.05
    mode: box
    unit_of_measurement: "1/h"
    optimistic: true
    restore_value: true
    initial_value: 1.0
  # wpisywana przez blueprint z wybranego w HA czujnika
  - platform: template
    name: "Temperatura z termometru"
    id: room_temp
    icon: mdi:thermometer-bluetooth
    min_value: -20
    max_value: 60
    step: 0.1
    mode: box
    unit_of_measurement: "°C"
    device_class: temperature
    optimistic: true
    set_action:
      - lambda: |-
          id(room_ts) = millis();
          id(room_seen) = true;

text_sensor:
  - platform: template
    name: "Stan regulacji"
    id: reg_status
    icon: mdi:information-outline
    entity_category: diagnostic

interval:
  - interval: 60s
    then:
      - lambda: |-
          auto *ac = id(aux_id);
          const std::string zrodlo = id(temp_source).current_option();
          const std::string tryby = id(reg_modes).current_option();
          const bool grzanie = ac->mode == climate::CLIMATE_MODE_HEAT;
          const bool chlodzenie = ac->mode == climate::CLIMATE_MODE_COOL;
          const char *pomin = nullptr;
          if (zrodlo == "Czujnik klimatyzatora")
            pomin = "wyłączona - klimatyzator reguluje według swojego czujnika";
          else if (!grzanie && !chlodzenie)
            pomin = "czeka - klimatyzator wyłączony albo tryb inny niż grzanie/chłodzenie";
          else if ((grzanie && tryby == "Tylko chłodzenie") || (chlodzenie && tryby == "Tylko grzanie"))
            pomin = "wyłączona w tym trybie - klimatyzator reguluje według swojego czujnika";
          char buf[120];
          auto przerwij = [&](const char *powod) {
            id(at_on) = false;
            snprintf(buf, sizeof(buf), "autostrojenie przerwane - %s", powod);
            id(reg_status).publish_state(buf);
          };
          if (pomin != nullptr) {
            id(reg_i) = 0;
            id(reg_sent) = NAN;
            id(reg_mode) = -1;
            if (id(at_on))
              przerwij(pomin);
            else
              id(reg_status).publish_state(pomin);
            return;
          }
          if (id(reg_mode) != (int) ac->mode) {
            id(reg_i) = 0;
            id(reg_sent) = NAN;
            if (id(at_on) && id(reg_mode) != -1) {
              przerwij("zmiana trybu klimatyzatora");
              id(reg_mode) = (int) ac->mode;
              return;
            }
            id(reg_mode) = (int) ac->mode;
          }
          auto *cel_nr = grzanie ? id(room_target_heat) : id(room_target_cool);
          // nastawa zmieniona z pilota albo karty klimatyzatora = nowy cel pokoju dla tego trybu
          if (!std::isnan(id(reg_sent)) && fabsf(ac->target_temperature - id(reg_sent)) > 0.3f) {
            cel_nr->make_call().set_value(ac->target_temperature).perform();
            id(reg_i) = 0;
            if (id(at_on)) {
              przerwij("ręczna zmiana nastawy");
              id(reg_sent) = NAN;
              return;
            }
          }
          const float cel = cel_nr->state;
          const float max_off = ${reg_max}, kp = id(reg_kp).state, ki = id(reg_ki).state;
          // odczyt z wybranego źródła; NAN = brak (DS18B20 bez odczytu, termometr z HA milczy za długo)
          float pokoj = NAN;
          if (zrodlo == "DS18B20 na GPIO4")
            pokoj = id(ds_a).state;
          else if (zrodlo == "DS18B20 na GPIO5")
            pokoj = id(ds_b).state;
          else if (id(room_seen) && millis() - id(room_ts) < ${room_timeout_min} * 60000UL)
            pokoj = id(room_temp).state;
          float nastawa = cel;
          if (id(at_on)) {
            // Autostrojenie metodą przekaźnikową (Åström-Hägglund): nastawa skacze o ±at_amp wokół
            // punktu pracy, gdy pokój przekroczy cel ± histereza. Z okresu Tu i amplitudy wahań a:
            // Ku = 4d / (pi * sqrt(a^2 - h^2)), nastawy Tyreusa-Luybena: Kp = Ku/3.2, Ti = 2.2*Tu.
            const float d = ${at_amp}, h = ${at_hyst};
            const uint32_t teraz = millis();
            const uint32_t ostatnie = id(at_sw).empty() ? id(at_start) : id(at_sw).back();
            if (std::isnan(pokoj)) {
              przerwij("brak odczytu z termometru");
              id(reg_sent) = NAN;
              return;
            }
            if (teraz - id(at_start) > 8 * 3600000UL || teraz - ostatnie > 3 * 3600000UL) {
              przerwij("pokój nie reaguje na zmiany nastawy (za słaby klimatyzator albo duże zakłócenia)");
              id(reg_sent) = NAN;
              return;
            }
            // punkt pracy = cel + dotychczasowa korekta całki (stała różnica czujnika AC i pokoju)
            if (std::isnan(id(at_base))) {
              id(at_base) = clamp(cel + id(reg_i), 16.0f + d, 32.0f - d);
              id(at_high) = pokoj < cel;
            }
            if (!id(at_sw).empty())
              id(at_cur) = id(at_high) ? fminf(id(at_cur), pokoj) : fmaxf(id(at_cur), pokoj);
            if ((id(at_high) && pokoj > cel + h) || (!id(at_high) && pokoj < cel - h)) {
              id(at_high) = !id(at_high);
              if (!id(at_sw).empty())
                id(at_ext).push_back(id(at_cur));
              id(at_sw).push_back(teraz);
              id(at_cur) = pokoj;
            }
            // pierwszy półokres to dojście do celu; liczą się 2 pełne okresy po pierwszym przełączeniu
            if (id(at_sw).size() >= 5) {
              const auto &t = id(at_sw);
              const auto &e = id(at_ext);
              const float tu_h = ((t[2] - t[0]) + (t[3] - t[1]) + (t[4] - t[2])) / 3.0f / 3600000.0f;
              const float a = (fabsf(e[0] - e[1]) + fabsf(e[1] - e[2]) + fabsf(e[2] - e[3])) / 6.0f;
              id(at_on) = false;
              id(reg_sent) = NAN;
              if (a <= h * 1.05f) {
                snprintf(buf, sizeof(buf), "autostrojenie nieudane - wahania %.2f °C mniejsze niż histereza", a);
              } else {
                const float ku = 4 * d / (M_PI * sqrtf(a * a - h * h));
                const float nkp = clamp(ku / 3.2f, 0.1f, 5.0f);
                const float nki = clamp(nkp / (2.2f * tu_h), 0.0f, 10.0f);
                id(reg_kp).make_call().set_value(roundf(nkp * 20) / 20).perform();
                id(reg_ki).make_call().set_value(roundf(nki * 20) / 20).perform();
                snprintf(buf, sizeof(buf), "autostrojenie gotowe: Kp %.2f, Ki %.2f/h (Tu %.0f min, wahania ±%.2f °C)",
                         nkp, nki, tu_h * 60, a);
              }
              id(reg_status).publish_state(buf);
              return;
            }
            nastawa = roundf(clamp(id(at_base) + (id(at_high) ? d : -d), 16.0f, 32.0f) * 2) / 2;
            if (fabsf(nastawa - ac->target_temperature) >= 0.25f) {
              auto call = ac->make_call();
              call.set_target_temperature(nastawa);
              call.perform();
            }
            id(reg_sent) = nastawa;
            snprintf(buf, sizeof(buf), "autostrojenie: pokój %.1f / cel %.1f -> nastawa %.1f, przełączeń %u/5",
                     pokoj, cel, nastawa, (unsigned) id(at_sw).size());
            id(reg_status).publish_state(buf);
            return;
          }
          if (!std::isnan(pokoj)) {
            const float blad = cel - pokoj;
            id(reg_i) = clamp(id(reg_i) + ki * blad / 60.0f, -max_off, max_off);
            nastawa = clamp(cel + kp * blad + id(reg_i), cel - max_off, cel + max_off);
            snprintf(buf, sizeof(buf), "pokój %.1f / cel %.1f -> nastawa %.1f",
                     pokoj, cel, roundf(clamp(nastawa, 16.0f, 32.0f) * 2) / 2);
          } else {
            id(reg_i) = 0;
            snprintf(buf, sizeof(buf), "brak odczytu z termometru - nastawa = cel %.1f", cel);
          }
          nastawa = clamp(nastawa, 16.0f, 32.0f);
          // histereza 0,5 °C: szum termometru nie przestawia nastawy w kółko
          if (std::isnan(id(reg_sent)) || fabsf(nastawa - ac->target_temperature) >= 0.5f) {
            nastawa = roundf(nastawa * 2) / 2;
            auto call = ac->make_call();
            call.set_target_temperature(nastawa);
            call.perform();
            id(reg_sent) = nastawa;
          } else {
            id(reg_sent) = ac->target_temperature;
          }
          id(reg_status).publish_state(buf);

uart:
  id: ac_uart_bus
  tx_pin: ${uart_tx}
  rx_pin: ${uart_rx}
  baud_rate: 4800
  data_bits: 8
  parity: EVEN
  stop_bits: 1

time:
  - platform: homeassistant
    id: time_ha
    on_time:
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          # nie w trakcie autostrojenia - trwa kilka godzin i restart by je przerwał
          - if:
              condition:
                lambda: "return !id(at_on);"
              then:
                - button.press: reboot_button

sensor:
  - platform: internal_temperature
    name: "Temperatura ESP32"
  # bez podłączonego czujnika encja zostaje "nieznana"; czujnik dołożony później - restart modułu
  - platform: dallas_temp
    one_wire_id: ow_a
    id: ds_a
    name: "Temperatura DS18B20 GPIO4"
    update_interval: 30s
  - platform: dallas_temp
    one_wire_id: ow_b
    id: ds_b
    name: "Temperatura DS18B20 GPIO5"
    update_interval: 30s
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

button:
  - platform: restart
    name: "Force Reboot"
    id: reboot_button
  - platform: template
    name: "Autostrojenie - start"
    icon: mdi:auto-fix
    entity_category: config
    on_press:
      - lambda: |-
          if (id(temp_source).current_option() == "Czujnik klimatyzatora") {
            id(reg_status).publish_state("autostrojenie wymaga termometru - wybierz źródło temperatury pokoju");
            return;
          }
          id(at_sw).clear();
          id(at_ext).clear();
          id(at_base) = NAN;
          id(at_cur) = NAN;
          id(at_start) = millis();
          id(at_on) = true;
          id(reg_status).publish_state("autostrojenie: start, pierwszy odczyt w ciągu minuty");
  - platform: template
    name: "Autostrojenie - przerwij"
    icon: mdi:stop-circle-outline
    entity_category: config
    on_press:
      - lambda: |-
          if (!id(at_on))
            return;
          id(at_on) = false;
          id(reg_sent) = NAN;
          id(reg_status).publish_state("autostrojenie przerwane ręcznie - nastawy regulatora bez zmian");

climate:
  - platform: aux_ac
    name: None
    id: aux_id
    uart_id: ac_uart_bus
    period: 10s
    show_action: true
    display_inverted: true
    optimistic: true
    timeout: 150
    indoor_temperature:
      name: Indoor Temperature
      id: indoor_temp
      internal: false
    display_state:
      name: Display State
      id: display_state
      internal: false
    outdoor_temperature:
      name: Outdoor Temperature
      id: outdoor_temp
      internal: false
    outbound_temperature:
      name: Coolant Outbound Temperature
      id: outbound_temp
      internal: false
    inbound_temperature:
      name: Coolant Inbound Temperature
      id: inbound_temp
      internal: false
    compressor_temperature:
      name: Compressor Temperature
      id: compressor_temp
      internal: false
    defrost_state:
      name: Defrost State
      id: defrost_state
      internal: false
    inverter_power:
      name: Invertor Power
      id: inverter_power
      internal: false
    preset_reporter:
      name: Preset Reporter
      id: preset_reporter
      internal: false
    vlouver_state:
      name: VLouvers State
      id: vlouver_state
      internal: false
    visual:
      min_temperature: 16
      max_temperature: 32
      temperature_step: 0.5
    supported_modes:
      - COOL
      - HEAT
    custom_fan_modes:
      - MUTE
      - TURBO
    supported_swing_modes:
      - VERTICAL
      - HORIZONTAL
      - BOTH
